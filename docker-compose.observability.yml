# Optional overlay: adds Grafana with Tempo (traces) and Prometheus (metrics) in one container.
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up --build
# Grafana is then at http://localhost:3000.
services:
  lgtm:
    container_name: lgtm
    image: grafana/otel-lgtm:0.38.1
    ports:
      - "3000:3000"

  payment_gateway:
    environment:
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://lgtm:4318/v1/traces
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://lgtm:4318/v1/metrics
      MANAGEMENT_OTLP_METRICS_EXPORT_STEP: 10s
    depends_on:
      - lgtm
